name: rohd_source_navigator
description: >
  Dart implementation of the ROHD source navigator — path normalisation,
  frame cycling, and DTD service for cross-probe source navigation.
version: 0.1.0
homepage: https://intel.github.io/rohd-website/
repository: https://github.com/intel/rohd/tree/main/packages/rohd_source_navigator
issue_tracker: https://github.com/intel/rohd/issues

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  json_rpc_2: ^4.0.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  test: ^1.24.0
