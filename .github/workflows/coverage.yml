name: Coverage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Code Coverage
    env:
      ROHD_REQUIRE_VERILATOR: '1'
      ROHD_REQUIRE_SYSTEMC: '1'
    timeout-minutes: 60
    permissions:
      contents: write
    runs-on: ${{ github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v2
        with:
          channel: stable
          version: 3.47.2

      - name: Install dependencies
        run: tool/gh_actions/install_dependencies.sh

      - name: Install Icarus Verilog
        run: tool/gh_actions/install_iverilog.sh

      - name: Install Verilator
        run: bash tool/gh_actions/install_verilator.sh

      - name: Install Accellera SystemC
        run: tool/gh_actions/install_systemc.sh

      - name: Pre-build SystemC PCH and Makefile
        run: tool/gh_actions/setup_systemc_pch.sh

      - name: Generate coverage and badge
        run: tool/coverage/generate_coverage.sh --generate-svg

      - name: Save ROHD coverage badge
        run: cp /tmp/coverage-badge.svg /tmp/rohd-coverage-badge.svg

      - name: Generate DevTools coverage and badge
        working-directory: rohd_devtools_extension
        run: ../tool/coverage/generate_coverage.sh --generate-svg

      - name: Commit coverage badge
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Fetch and checkout badges branch
          git fetch origin badges:badges 2>/dev/null || git checkout --orphan badges
          git checkout badges 2>/dev/null || true
          
          # Clean and copy badge
          git rm -rf . 2>/dev/null || true
          mkdir -p coverage/rohd_devtools_extension
          cp /tmp/rohd-coverage-badge.svg "coverage/${BRANCH_NAME}.svg"
          cp /tmp/coverage-badge.svg "coverage/rohd_devtools_extension/${BRANCH_NAME}.svg"
          
          git add "coverage/${BRANCH_NAME}.svg" "coverage/rohd_devtools_extension/${BRANCH_NAME}.svg"
          git diff --staged --quiet || git commit -m "Update coverage badge for ${BRANCH_NAME} [skip ci]"
          
          git push origin badges --force
