name: Extension release artifact

on:
  push:
    tags:
      - 'rohd-vscode-v*.*.*'
  workflow_dispatch:

permissions: {}

jobs:
  build-vsix:
    name: Build Marketplace VSIX
    permissions:
      contents: read
    timeout-minutes: 15
    runs-on: ${{ github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
        working-directory: rohd_extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: rohd_extension/.nvmrc
          cache: npm
          cache-dependency-path: rohd_extension/package-lock.json

      - name: Validate Marketplace release identity
        id: package
        run: |
          set -euo pipefail
          make verify-extension-version
          version="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"
          publisher="$(node -p "require('./package.json').publisher")"
          package_name="$(node -p "require('./package.json').name")"
          if [[ "$publisher" != "intel-corporation" ]]; then
            echo "Marketplace publisher must be intel-corporation, got $publisher." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" &&
                "$GITHUB_REF_NAME" != "rohd-vscode-v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match extension version $version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=$RUNNER_TEMP/$publisher.$package_name-$version.vsix" >> "$GITHUB_OUTPUT"
          echo "checksum=$RUNNER_TEMP/$publisher.$package_name-$version.vsix.sha256" >> "$GITHUB_OUTPUT"

      - name: Verify Marketplace extension pack is published
        run: bash tool/verify_extension_pack.sh --verify-published

      - name: Package and verify Marketplace VSIX
        run: bash ../tool/package_vscode.sh "${{ steps.package.outputs.vsix }}"

      - name: Checksum verified VSIX
        run: |
          sha256sum "${{ steps.package.outputs.vsix }}" > "${{ steps.package.outputs.checksum }}"

      - name: Upload Marketplace VSIX
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: intel-corporation-rohd-${{ steps.package.outputs.version }}-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.vsix }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 90

      - name: Add admin publication instructions
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          VSIX: ${{ steps.package.outputs.vsix }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          {
            echo '## Verified Intel ROHD VSIX'
            echo
            echo "Download the [tested VSIX artifact](${ARTIFACT_URL}) and extract the GitHub artifact ZIP."
            echo 'Verify the included checksum, then install and review the VSIX in the target VS Code environment.'
            echo 'An authorized admin for the intel-corporation Marketplace publisher can upload the contained VSIX through the publisher management page.'
            echo 'Do not upload the GitHub ZIP or rebuild the package before publication.'
            echo
            echo 'Marketplace signing happens after publication. This workflow does not publish or require Marketplace credentials.'
            echo
            echo "\`sha256sum -c $(basename "$CHECKSUM")\`"
          } >> "$GITHUB_STEP_SUMMARY"
