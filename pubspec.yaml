name: rohd
version: 0.6.11
description: The Rapid Open Hardware Development (ROHD) framework, a framework for describing and verifying hardware.
homepage: https://intel.github.io/rohd-website
repository: https://github.com/intel/rohd
issue_tracker: https://github.com/intel/rohd/issues
documentation: https://intel.github.io/rohd-website/docs/sample-example/

environment:
  sdk: ^3.6.0

workspace:
  - packages/rohd_hierarchy
  - packages/rohd_waveform
  - packages/rohd_devtools_widgets
  - packages/rohd_source_navigator
  - rohd_devtools_extension

dependencies:
  collection: ^1.15.0
  logging: ^1.0.1
  meta: ^1.9.0
  rohd_hierarchy: ^0.1.1
  test: ^1.17.3
  yaml: ^3.1.1

dev_dependencies:
  benchmark_harness: ^2.2.0
  coverage: ^1.10.0
