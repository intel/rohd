name: rohd_devtools_widgets
description: "Shared widgets for ROHD DevTools sub-packages: help button, PNG export, auto-hiding overlay."
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter: {sdk: flutter}
  material_ui: ^1.1.0
  rohd: ^0.6.9
  rohd_hierarchy:
    path: ../../../packages/rohd_hierarchy
  web: ^1.0.0
dev_dependencies:
  flutter_test: {sdk: flutter}
  lints: ^5.0.0

dependency_overrides:
  rohd:
    path: ../../..

flutter:
  assets:
    - assets/extension/
