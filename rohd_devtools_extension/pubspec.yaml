name: rohd_devtools_extension
description: "DevTool extension on ROHD."
publish_to: 'none'

version: 1.0.0+1

environment:
 sdk: ^3.6.0

dependencies:
  cupertino_icons: ^1.0.2
  devtools_app_shared: ^0.5.0
  devtools_extensions: ^0.5.0
  devtools_shared: ^13.0.1
  dtd: ^4.0.0
  equatable: ^2.0.5
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  # JavaScript runtime for native platforms (Linux) - pattern from rohd-schematic-viewer
  flutter_js: ^0.8.5
  flutter_simple_treeview: ^3.0.2
  flutter_web_plugins:
    sdk: flutter
  logging: ^1.2.0
  material_ui: ^1.1.0
  path: ^1.9.0
  path_provider: ^2.1.0
  rohd:
    path: ..
  rohd_devtools_widgets:
    path: ../packages/rohd_devtools_widgets
  rohd_hierarchy:
    path: ../packages/rohd_hierarchy
  rohd_source_navigator:
    path: ../packages/rohd_source_navigator
  rohd_wave_viewer: ^0.1.0
  # Shares the viewer's extended monitored-waveform model.
  rohd_waveform: ^0.0.2
  vm_service: ^14.0.0
  web: ^1.0.0
  web_socket_channel: ^3.0.0
  # WebView for embedded viewers
  webview_flutter: ^4.4.2
  webview_flutter_web: ^0.2.2+4

dev_dependencies:
  bloc_lint: ^0.3.5
  bloc_test: ^10.0.0
  build_runner: ^2.4.7
  flutter_lints: ^3.0.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.2

dependency_overrides:
  rohd:
    path: ..
  rohd_devtools_widgets:
    path: ../packages/rohd_devtools_widgets
  rohd_hierarchy:
    path: ../packages/rohd_hierarchy
  rohd_source_navigator:
    path: ../packages/rohd_source_navigator

flutter:
  uses-material-design: true
  assets:
    - assets/help/
    - assets/icons/
