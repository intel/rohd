name: rohd_devtools_extension
description: "DevTool extension on ROHD."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0
  flutter: '>=3.44.0'

resolution: workspace

dependencies:
  cupertino_icons: '>=1.0.9 <3.0.0'
  dart_wellen: ^0.1.0
  devtools_app_shared: ^0.5.0
  devtools_extensions: ^0.5.0
  devtools_shared: ^13.0.1
  dtd: ^4.0.0
  equatable: '>=2.0.5 <4.0.0'
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  # JavaScript runtime for native platforms (Linux) - pattern from rohd-schematic-viewer
  flutter_js: ^0.8.5
  flutter_simple_treeview: ^3.0.2
  flutter_web_plugins:
    sdk: flutter
  logging: ^1.2.0
  # Keep below 1.3.0 for the Dart 3.6 CI toolchain.
  material_ui: ">=1.1.0 <1.3.0"
  path: ^1.9.0
  path_provider: ^2.1.0
  rohd: ^0.6.11
  rohd_devtools_widgets:
    path: ../packages/rohd_devtools_widgets
  rohd_hierarchy: ^0.1.1
  rohd_schematic_viewer: ^0.2.4
  rohd_source_navigator: ^0.1.0
  rohd_wave_viewer: ^0.1.0
  # Shares the viewer's extended monitored-waveform model.
  rohd_waveform: ^0.1.1
  vm_service: ^14.0.0
  web: ^1.0.0
  web_socket_channel: ^3.0.0
  # WebView for embedded viewers
  webview_flutter: ^4.4.2
  webview_flutter_web: ^0.2.2+4

dev_dependencies:
  bloc_lint: ^0.3.5
  bloc_test: ^10.0.0
  build_runner: ^2.4.7
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.2
  test: ^1.25.15

flutter:
  uses-material-design: true
  assets:
    - assets/help/
    - assets/layout_bridge/
    - assets/third_party/elkjs/
    - assets/third_party/elkjs/LICENSES/elkjs_LICENSES.txt
    - assets/rohd_icon.png
    - assets/systemverilog_icon.png
    - assets/systemc_icon.png
